name: Pact Contract Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  consumer:
    name: Consumer Tests (generate pact)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout pact-contract-tests
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run consumer tests
        run: npm run test:consumer

      - name: Upload pact file
        uses: actions/upload-artifact@v7
        with:
          name: pact-file
          path: pacts/
          retention-days: 1

  provider:
    name: Provider Verification
    runs-on: ubuntu-latest
    needs: consumer
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout pact-contract-tests
        uses: actions/checkout@v7

      - name: Checkout movie-catalog-api
        uses: actions/checkout@v7
        with:
          repository: EnesAkyel/movie-catalog-api
          path: movie-catalog-api

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build movie-catalog-api
        run: ./mvnw package -DskipTests -q
        working-directory: movie-catalog-api

      - name: Start movie-catalog-api
        run: |
          cp target/movie-catalog-api-*.jar app.jar
          docker build -f Dockerfile.ci -t movie-catalog-api .
          rm app.jar
          docker compose up -d
        working-directory: movie-catalog-api
        env:
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/v3/api-docs > /dev/null 2>&1; then
              echo "API ready after $((i * 5))s"
              exit 0
            fi
            echo "Attempt $i/30 - retrying in 5s..."
            sleep 5
          done
          echo "API did not become ready in time"
          docker compose logs --tail=100
          exit 1
        working-directory: movie-catalog-api

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download pact file
        uses: actions/download-artifact@v8
        with:
          name: pact-file
          path: pacts/

      - name: Run provider verification
        run: npm run test:provider
        env:
          BASE_URL: http://localhost:8080
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
